<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="FERME MANAGEMENT - Système de gestion avicole" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ferme" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>FERME MANAGEMENT</title>
    <style>
      /* Prevent FOUC */
      body { margin: 0; background: #f9fafb; }
      #splash {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; background: linear-gradient(135deg, #14532d, #166534, #15803d);
        z-index: 9999; transition: opacity 0.3s ease;
      }
      #splash .logo { text-align: center; color: white; }
      #splash .logo h1 { font-size: 1.5rem; font-weight: 700; margin: 12px 0 4px; font-family: Inter, sans-serif; }
      #splash .logo p { font-size: 0.75rem; opacity: 0.7; font-family: Inter, sans-serif; }
      #splash .spinner {
        width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2);
        border-top-color: white; border-radius: 50%; margin: 0 auto;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="logo">
        <div class="spinner"></div>
        <h1>FERME MANAGEMENT</h1>
        <p>Gestion Avicole</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove splash screen once app loads
      window.addEventListener('load', () => {
        const splash = document.getElementById('splash');
        if (splash) {
          setTimeout(() => {
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 300);
          }, 500);
        }
      });
    </script>
  </body>
</html>
